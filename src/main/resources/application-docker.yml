spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nutrilogic
    username: nutrilogic_user
    password: your_password_here
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true