<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NutriLogic — Дневник питания</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Дневник питания</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link active" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>📅 Выберите дату</span>
                <form action="/diary" method="get" class="d-flex">
                    <input type="date" name="date" th:value="${date}" class="form-control form-control-sm me-2" style="width: auto;">
                    <button type="submit" class="btn btn-sm btn-light">Показать</button>
                </form>
            </div>
            <div class="card-body">
                <h5 th:text="'Дата: ' + ${date}"></h5>

                <form action="/diary/add" method="post" class="mb-4">
                    <input type="hidden" name="date" th:value="${date}">
                    <div class="row g-2">
                        <div class="col-md-5">
                            <select name="productId" class="form-select" required>
                                <option value="">Выберите продукт</option>
                                <option th:each="p : ${allProducts}" th:value="${p.name}" th:text="${p.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="10" name="quantity" class="form-control" placeholder="г" required>
                        </div>
                        <div class="col-md-3">
                            <select name="mealType" class="form-select">
                                <option value="breakfast">Завтрак</option>
                                <option value="lunch">Обед</option>
                                <option value="dinner">Ужин</option>
                                <option value="snack">Перекус</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">➕ Добавить</button>
                        </div>
                    </div>
                </form>

                <div th:each="entry : ${entry.meals}">
                    <h6 th:text="|${entry.key == 'breakfast' ? '🍳 Завтрак' : (entry.key == 'lunch' ? '🍲 Обед' : (entry.key == 'dinner' ? '🍽️ Ужин' : '🥨 Перекус'))}|"></h6>
                    <ul class="list-group mb-3">
                        <li th:each="item, stat : ${entry.value}" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${item.product.name}"></strong> —
                                <span th:text="${item.quantity}"></span> г,
                                <span th:text="${#numbers.formatDecimal(item.calories, 1, 0)}"></span> ккал
                            </div>
                            <form action="/diary/remove" method="post" class="m-0">
                                <input type="hidden" name="date" th:value="${date}">
                                <input type="hidden" name="mealType" th:value="${entry.key}">
                                <input type="hidden" name="index" th:value="${stat.index}">
                                <button type="submit" class="btn btn-sm btn-danger">✖</button>
                            </form>
                        </li>
                    </ul>
                </div>

                <div th:unless="${entry.meals.empty}" class="text-end">
                    <form action="/diary/clear-day" method="post">
                        <input type="hidden" name="date" th:value="${date}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Очистить день</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 text-center text-muted small">
    Данные: health-diet.ru. Избранные продукты выделены жёлтой кнопкой ⭐.
</footer>
</body>
</html>
