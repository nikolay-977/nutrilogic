<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NutriLogic — Дневник питания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Дневник питания</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link active" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span>📅 Выберите дату</span>
                <form action="/diary" class="d-flex" method="get">
                    <input class="form-control form-control-sm me-2" name="date" style="width: auto;" th:value="${date}"
                           type="date">
                    <button class="btn btn-sm btn-light" type="submit">Показать</button>
                </form>
            </div>
            <div class="card-body">
                <h5 th:text="'Дата: ' + ${date}"></h5>

                <form action="/diary/add" class="mb-4" method="post">
                    <input name="date" th:value="${date}" type="hidden">
                    <div class="row g-2">
                        <div class="col-md-5">
                            <select class="form-select" name="productId" required>
                                <option value="">Выберите продукт</option>
                                <option th:each="p : ${allProducts}" th:text="${p.name}" th:value="${p.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input class="form-control" name="quantity" placeholder="г" required step="10"
                                   type="number">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="mealType">
                                <option value="breakfast">Завтрак</option>
                                <option value="lunch">Обед</option>
                                <option value="dinner">Ужин</option>
                                <option value="snack">Перекус</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-success w-100" type="submit">➕ Добавить</button>
                        </div>
                    </div>
                </form>

                <!-- ИСПРАВЛЕННАЯ ЧАСТЬ: используем ${meals}, а не ${entry.meals} -->
                <div th:each="mealEntry : ${meals}" th:with="mealTypeName=${mealEntry.key}">
                    <h6 th:text="${mealTypeName == 'breakfast' ? '🍳 Завтрак' : (mealTypeName == 'lunch' ? '🍲 Обед' : (mealTypeName == 'dinner' ? '🍽️ Ужин' : '🥨 Перекус'))}"></h6>
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="item, stat : ${mealEntry.value}">
                            <div>
                                <strong th:text="${item.product.name}"></strong> —
                                <span th:text="${item.quantity}"></span> г,
                                <span th:text="${#numbers.formatDecimal(item.calories, 1, 0)}"></span> ккал
                            </div>
                            <form action="/diary/remove" class="m-0" method="post">
                                <input name="date" th:value="${date}" type="hidden">
                                <input name="mealType" th:value="${mealEntry.key}" type="hidden">
                                <input name="index" th:value="${stat.index}" type="hidden">
                                <button class="btn btn-sm btn-danger" type="submit">✖</button>
                            </form>
                        </li>
                    </ul>
                </div>

                <div class="text-center text-muted" th:if="${#maps.isEmpty(meals)}">
                    Нет записей за этот день.
                </div>

                <div class="text-end" th:unless="${#maps.isEmpty(meals)}">
                    <form action="/diary/clear-day" method="post">
                        <input name="date" th:value="${date}" type="hidden">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Очистить день</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 text-center text-muted small">
    Данные: health-diet.ru. Избранные продукты выделены жёлтой кнопкой ⭐.
</footer>
</body>
</html>
