<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Страница не найдена</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">❌ Ошибка 404</h5>
            </div>
            <div class="card-body text-center py-5">
                <div class="display-1 fw-bold text-muted mb-3">404</div>
                <h2 class="mb-3">Страница не найдена</h2>
                <p class="lead mb-4" th:text="${errorMessage}">Запрашиваемая страница отсутствует.</p>
                <p class="text-muted small bg-light p-2 rounded" th:if="${detail}" th:text="${detail}"></p>
                <a class="btn btn-primary mt-2" href="/">🏠 Вернуться на главную</a>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 text-center text-muted small">
    NutriLogic — умное питание
</footer>
</body>
</html>
