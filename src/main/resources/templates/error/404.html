<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-5 text-center">
<h1 class="display-1 text-muted">404</h1>
<h2 class="mb-4">Страница не найдена</h2>
<p class="lead" th:text="${errorMessage}">Запрашиваемая страница отсутствует.</p>
<p th:if="${detail}" class="text-secondary" th:text="${detail}"></p>
<a href="/" class="btn btn-primary mt-3">Вернуться на главную</a>
</body>
</html>
