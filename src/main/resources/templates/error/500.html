<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка сервера</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-5 text-center">
<h1 class="display-1 text-danger">500</h1>
<h2 class="mb-4">Внутренняя ошибка сервера</h2>
<p class="lead" th:text="${errorMessage}">Что-то пошло не так. Пожалуйста, попробуйте позже.</p>
<p th:if="${detail}" class="text-secondary small" th:text="${detail}"></p>
<a href="/" class="btn btn-primary mt-3">На главную</a>
</body>
</html>
