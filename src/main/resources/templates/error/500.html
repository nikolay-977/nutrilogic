<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка сервера</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Ошибка сервера</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">⚠️ Ошибка 500</h5>
            </div>
            <div class="card-body text-center py-5">
                <div class="display-1 fw-bold text-danger mb-3">500</div>
                <h2 class="mb-3">Внутренняя ошибка сервера</h2>
                <p class="lead mb-4" th:text="${errorMessage}">Что-то пошло не так. Пожалуйста, попробуйте позже.</p>
                <p th:if="${detail}" class="text-muted small bg-light p-2 rounded" th:text="${detail}"></p>
                <a href="/" class="btn btn-primary mt-2">🏠 Вернуться на главную</a>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 text-center text-muted small">
    NutriLogic — умное питание
</footer>
</body>
</html>
