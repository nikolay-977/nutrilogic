<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление контентом</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<h1 class="mb-4">📦 Управление контентом</h1>

<div class="card mb-4">
    <div class="card-header bg-primary text-white">Загрузить продукты</div>
    <div class="card-body">
        <form method="post" action="/content-management/upload" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="files" class="form-label">Выберите JSON-файлы (можно несколько)</label>
                <input type="file" class="form-control" id="files" name="files" accept=".json" multiple required>
            </div>
            <button type="submit" class="btn btn-success">📤 Загрузить контент</button>
        </form>
    </div>
</div>

<!-- Отображение результатов -->
<div th:if="${uploadResults != null}" class="card mb-4">
    <div class="card-header">Результаты загрузки</div>
    <div class="card-body">
        <p>✅ Успешно: <span th:text="${successCount}"></span> | ❌ Ошибок: <span th:text="${errorCount}"></span></p>
        <ul>
            <li th:each="result : ${uploadResults}" th:text="${result}"></li>
        </ul>
    </div>
</div>

<a href="/profile" class="btn btn-secondary">← Назад в профиль</a>

</body>
</html>
