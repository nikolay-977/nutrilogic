<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NutriLogic — Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Ваш персональный профиль</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link active" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <form action="/profile/save" class="card p-4 shadow-sm" method="post">
            <h4 class="mb-3">Основные данные</h4>
            <div class="mb-3">
                <label>Имя</label>
                <input class="form-control" name="name" required th:value="${profile.name}" type="text">
            </div>
            <div class="mb-3">
                <label>Пол</label>
                <select class="form-select" name="gender">
                    <option th:selected="${profile.gender == 'male'}" value="male">Мужской</option>
                    <option th:selected="${profile.gender == 'female'}" value="female">Женский</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Дата рождения</label>
                <input class="form-control" name="birthDate" th:value="${profile.birthDate != null ? #temporals.format(profile.birthDate, 'yyyy-MM-dd') : ''}"
                       type="date">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Рост (см)</label>
                    <input class="form-control" name="height" step="1" th:value="${profile.height}" type="number">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Вес (кг)</label>
                    <input class="form-control" name="weight" step="0.1" th:value="${profile.weight}" type="number">
                </div>
            </div>
            <div class="mb-3">
                <label>Уровень активности</label>
                <select class="form-select" name="activityLevel">
                    <option th:selected="${profile.activityLevel == 'sedentary'}" value="sedentary">Сидячий</option>
                    <option th:selected="${profile.activityLevel == 'light'}" value="light">Лёгкий</option>
                    <option th:selected="${profile.activityLevel == 'moderate'}" value="moderate">Умеренный</option>
                    <option th:selected="${profile.activityLevel == 'active'}" value="active">Активный</option>
                    <option th:selected="${profile.activityLevel == 'very_active'}" value="very_active">Очень активный
                    </option>
                </select>
            </div>

            <h4 class="mb-3 mt-3">Дневные цели (нормы)</h4>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Калории (ккал)</label>
                    <input class="form-control" name="targetCalories" step="10" th:value="${profile.targetCalories}"
                           type="number">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Белки (г)</label>
                    <input class="form-control" name="targetProtein" step="1" th:value="${profile.targetProtein}"
                           type="number">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Жиры (г)</label>
                    <input class="form-control" name="targetFat" step="1" th:value="${profile.targetFat}" type="number">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Углеводы (г)</label>
                    <input class="form-control" name="targetCarbs" step="1" th:value="${profile.targetCarbs}"
                           type="number">
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-3" type="submit">Сохранить профиль</button>
            <hr>
            <hr>
            <a class="btn btn-outline-secondary w-100" href="/profile/preferences">⭐ Управление избранным и
                стоп-листом</a>
            <a class="btn btn-outline-secondary w-100 mt-2" href="/content-management">📦 Управление контентом</a>
        </form>
    </div>
</div>
</body>
</html>
