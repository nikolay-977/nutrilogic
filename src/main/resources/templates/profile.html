<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NutriLogic — Профиль</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<div class="text-center mb-5">
    <h1 class="display-5 fw-bold">🥗 NutriLogic</h1>
    <p class="lead">Ваш персональный профиль</p>
</div>

<ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Дашборд</a></li>
    <li class="nav-item"><a class="nav-link" href="/diary">📓 Дневник</a></li>
    <li class="nav-item"><a class="nav-link" href="/search">🔍 Поиск</a></li>
    <li class="nav-item"><a class="nav-link" href="/recommend">📊 Рекомендации</a></li>
    <li class="nav-item"><a class="nav-link" href="/meal-planner">🍽️ Планировщик</a></li>
    <li class="nav-item"><a class="nav-link active" href="/profile">👤 Профиль</a></li>
</ul>

<div class="row justify-content-center">
    <div class="col-md-8">
        <form action="/profile/save" method="post" class="card p-4 shadow-sm">
            <h4 class="mb-3">Основные данные</h4>
            <div class="mb-3">
                <label>Имя</label>
                <input type="text" name="name" class="form-control" th:value="${profile.name}" required>
            </div>
            <div class="mb-3">
                <label>Пол</label>
                <select name="gender" class="form-select">
                    <option value="male" th:selected="${profile.gender == 'male'}">Мужской</option>
                    <option value="female" th:selected="${profile.gender == 'female'}">Женский</option>
                    <option value="other" th:selected="${profile.gender == 'other'}">Другой</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Дата рождения</label>
                <input type="date" name="birthDate" class="form-control" th:value="${profile.birthDate != null ? #temporals.format(profile.birthDate, 'yyyy-MM-dd') : ''}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Рост (см)</label>
                    <input type="number" step="1" name="height" class="form-control" th:value="${profile.height}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Вес (кг)</label>
                    <input type="number" step="0.1" name="weight" class="form-control" th:value="${profile.weight}">
                </div>
            </div>
            <div class="mb-3">
                <label>Уровень активности</label>
                <select name="activityLevel" class="form-select">
                    <option value="sedentary" th:selected="${profile.activityLevel == 'sedentary'}">Сидячий</option>
                    <option value="light" th:selected="${profile.activityLevel == 'light'}">Лёгкий</option>
                    <option value="moderate" th:selected="${profile.activityLevel == 'moderate'}">Умеренный</option>
                    <option value="active" th:selected="${profile.activityLevel == 'active'}">Активный</option>
                    <option value="very_active" th:selected="${profile.activityLevel == 'very_active'}">Очень активный</option>
                </select>
            </div>

            <h4 class="mb-3 mt-3">Дневные цели (нормы)</h4>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Калории (ккал)</label>
                    <input type="number" step="10" name="targetCalories" class="form-control" th:value="${profile.targetCalories}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Белки (г)</label>
                    <input type="number" step="1" name="targetProtein" class="form-control" th:value="${profile.targetProtein}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Жиры (г)</label>
                    <input type="number" step="1" name="targetFat" class="form-control" th:value="${profile.targetFat}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Углеводы (г)</label>
                    <input type="number" step="1" name="targetCarbs" class="form-control" th:value="${profile.targetCarbs}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить профиль</button>
            <hr>
            <a href="/profile/preferences" class="btn btn-outline-secondary w-100">⭐ Управление избранным и стоп-листом</a>
        </form>
    </div>
</div>
</body>
</html>
